name: lgsm-notify CI/CD

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
      - "develop"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  REGISTRY: "ghcr.io"
  IMAGE: "ghcr.io/kabaize/lgsm-notify"
  IMAGE_TAR: "image.tar"

jobs:
  test-and-source-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_BLOCKING: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.base_ref == 'main' || github.base_ref == 'develop') && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # gitleaks needs full history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: tests
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest

      - name: semgrep
        continue-on-error: ${{ env.SEMGREP_BLOCKING != 'true' }}
        run: semgrep scan --config .semgrep/ --error --metrics=off .

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact -v

      - name: trivy fs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

  build-docker:
    runs-on: ubuntu-latest
    needs: test-and-source-scan

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./lgsm-notify/Dockerfile
          push: false
          tags: ${{ env.IMAGE }}:ci
          load: true
          cache-from: type=gha,scope=lgsm-notify
          cache-to: type=gha,mode=max,scope=lgsm-notify

      - name: Save Docker image
        run: docker save ${{ env.IMAGE }}:ci -o ${{ env.IMAGE_TAR }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ env.IMAGE_TAR }}
          retention-days: 1

  security-scan:
    runs-on: ubuntu-latest
    needs: build-docker
    permissions:
      contents: read
      security-events: write
    env:
      # Block the pipeline on HIGH/CRITICAL findings only for main (the only branch that publishes to GHCR).
      # Other branches (e.g. develop) still report findings to the Security tab but don't fail the run.
      TRIVY_EXIT_CODE: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && '1' || '0' }}

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image

      - name: Confirm downloaded image artifact
        run: |
          ls -lh
          test -f ${{ env.IMAGE_TAR }}

      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: |
            trivy-db-

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ env.IMAGE_TAR }}
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-api-results.sarif"
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          ignore-unfixed: true
          vuln-type: "os,library"
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 7

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-image"

  publish:
    runs-on: ubuntu-latest
    needs: security-scan
    environment: prod
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image

      - name: Confirm downloaded image artifact
        run: |
          ls -lh
          test -f ${{ env.IMAGE_TAR }}

      - name: Load Docker images
        run: |
          docker load -i ${{ env.IMAGE_TAR }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image for GitHub Container Registry
        run: |
          docker tag ${{ env.IMAGE }}:ci ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:ci ${{ env.IMAGE }}:${{ github.sha }}

      - name: Push Docker image to GitHub Container Registry
        run: |
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
